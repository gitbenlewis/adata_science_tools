<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ session.get('csrf', '') }}">
  <title>adata_science_tools</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block scripts %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="brand-icon">a<span>•</span></span><strong>adata_science_tools</strong></a>
    <div class="account">
      {% if session.get('username') %}
      <span>{{ session['username'] }}</span>
      <form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf" value="{{ session['csrf'] }}"><button class="quiet" type="submit">Sign out</button></form>
      {% else %}<a href="{{ url_for('login') }}">Sign in <span aria-hidden="true">↗</span></a>{% endif %}
    </div>
  </header>
  {% block body %}{% endblock %}
</body>
</html>
